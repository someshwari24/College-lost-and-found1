<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Claims | College Lost & Found</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #172033;
            background: #f4f7fb;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: linear-gradient(135deg, #4338ca, #6558ef);
            box-shadow: 0 8px 24px rgba(67, 56, 202, 0.18);
        }

        nav {
            width: min(1180px, calc(100% - 32px));
            min-height: 66px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a,
        nav b {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 10px 15px;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.14);
        }

        nav b {
            background: rgba(255, 255, 255, 0.2);
        }

        .count-badge {
            min-width: 20px;
            height: 20px;
            margin-left: 6px;
            padding: 0 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            background: #ef4444;
            color: white;
            font-size: 11px;
            font-weight: 800;
        }

        .count-badge:empty {
            display: none;
        }

        .container {
            width: min(1180px, calc(100% - 32px));
            margin: 34px auto 60px;
        }

        .page-hero {
            margin-bottom: 26px;
            padding: 28px 30px;
            border: 1px solid #e3e8f2;
            border-radius: 22px;
            background: linear-gradient(135deg, #ffffff, #f8f9ff);
            box-shadow: 0 14px 34px rgba(31, 45, 75, 0.08);
        }

        .page-hero h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 38px);
            color: #18213a;
        }

        .page-hero p {
            margin: 0;
            color: #667085;
            line-height: 1.6;
        }

        #message {
            margin-bottom: 18px;
        }

        #message:empty {
            display: none;
        }

        .message {
            padding: 14px 16px;
            border-radius: 12px;
            font-weight: 700;
        }

        .message.success {
            color: #166534;
            background: #dcfce7;
            border: 1px solid #bbf7d0;
        }

        .message.error {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fecaca;
        }

        #claims {
            display: grid;
            gap: 26px;
        }

        .claim-card {
            padding: 24px;
            border: 1px solid #e3e8f2;
            border-radius: 22px;
            background: white;
            box-shadow: 0 14px 35px rgba(31, 45, 75, 0.08);
        }

        .claim-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #edf0f5;
        }

        .claim-card-header > div {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 7px 11px;
            border-radius: 999px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 800;
        }

        .status-pending {
            background: #fff7db;
            color: #8a5b00;
        }

        .status-approved,
        .status-resolved {
            background: #dcfce7;
            color: #166534;
        }

        .status-returned {
            background: #e0f2fe;
            color: #075985;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .claim-id-text {
            color: #7b8497;
            font-size: 13px;
            font-weight: 700;
        }

        .claim-items-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
            margin-bottom: 22px;
        }

        .claim-item-summary {
            min-height: 230px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            border: 1px solid #e4e8f0;
            border-radius: 16px;
            background: #f9fafc;
        }

        .claim-item-label {
            margin-bottom: 10px;
            color: #697386;
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .claim-item-image {
            width: 130px;
            height: 130px;
            margin-bottom: 12px;
            object-fit: cover;
            border-radius: 14px;
            border: 1px solid #dfe4ec;
            background: white;
        }

        .no-image {
            width: 130px;
            height: 130px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            border: 1px dashed #cfd6e2;
            background: white;
            color: #8a93a5;
            font-size: 13px;
        }

        .claim-item-summary h3 {
            margin: 0;
            color: #1f2937;
            font-size: 18px;
            overflow-wrap: anywhere;
        }

        .claim-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5146e5;
            font-size: 28px;
            font-weight: 800;
        }

        .verification-card,
        .claim-progress,
        .contact-card {
            margin-top: 18px;
            padding: 20px;
            border-radius: 16px;
        }

        .verification-card {
            border: 1px solid #f0d997;
            background: #fffaf0;
        }

        .verification-card h4,
        .contact-card h4 {
            margin: 0 0 14px;
            font-size: 17px;
            color: #26324b;
        }

        .verification-field {
            padding: 14px 0;
            border-top: 1px solid rgba(138, 91, 0, 0.12);
        }

        .verification-field:first-of-type {
            padding-top: 0;
            border-top: none;
        }

        .verification-field:last-child {
            padding-bottom: 0;
        }

        .verification-field strong {
            display: block;
            margin-bottom: 6px;
            color: #71530a;
            font-size: 13px;
        }

        .verification-field p {
            margin: 0;
            color: #3f4654;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .claim-progress {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            border: 1px solid #e3e8f2;
            background: #f8fafc;
        }

        .progress-row {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-radius: 12px;
            background: white;
            border: 1px solid #e5e9f0;
        }

        .progress-row span {
            color: #5f697d;
            font-size: 14px;
            font-weight: 700;
        }

        .progress-row strong {
            color: #111827;
        }

        .contact-card {
            border: 1px solid #d9dcff;
            background: #f5f4ff;
        }

        .contact-card p {
            margin: 8px 0 0;
            color: #475467;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .contact-card a {
            color: #4338ca;
            font-weight: 700;
        }

        .contact-hidden {
            border-color: #e5e7eb;
            background: #f8fafc;
        }

        .claim-actions {
            margin-top: 20px;
            padding-top: 18px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            flex-wrap: wrap;
            border-top: 1px solid #edf0f5;
        }

        .claim-actions button {
            min-width: 180px;
            min-height: 46px;
            padding: 11px 18px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4f46e5, #665cf4);
            color: white;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 18px rgba(79, 70, 229, 0.2);
        }

        .claim-actions button:hover {
            transform: translateY(-1px);
        }

        .claim-actions button.danger {
            background: #dc2626;
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.18);
        }

        .claim-actions button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            transform: none;
        }

        .claim-help-text {
            margin: 16px 0 0;
            padding: 14px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .rejected-text {
            color: #991b1b;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }

        .resolved-text {
            color: #166534;
            background: #ecfdf3;
            border: 1px solid #bbf7d0;
        }

        .selected-claim-card {
            outline: 3px solid rgba(79, 70, 229, 0.3);
            box-shadow: 0 18px 45px rgba(79, 70, 229, 0.18);
        }

        .empty-state,
        .loading-card {
            min-height: 190px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            border: 1px solid #e3e8f2;
            border-radius: 20px;
            background: white;
            box-shadow: 0 14px 35px rgba(31, 45, 75, 0.07);
        }

        .loading-spinner {
            width: 42px;
            height: 42px;
            border: 4px solid #e5e7ff;
            border-top-color: #5146e5;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-card strong {
            color: #29324a;
            font-size: 17px;
        }

        .loading-card span {
            color: #7a8398;
            font-size: 14px;
        }

        .muted {
            color: #667085;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 760px) {
            nav {
                overflow-x: auto;
                padding: 10px 0;
            }

            nav a,
            nav b {
                flex-shrink: 0;
            }

            .claim-items-grid {
                grid-template-columns: 1fr;
            }

            .claim-arrow {
                transform: rotate(90deg);
                min-height: 32px;
            }

            .claim-progress {
                grid-template-columns: 1fr;
            }

            .claim-card-header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 520px) {
            .container {
                width: min(100% - 20px, 1180px);
                margin-top: 20px;
            }

            .page-hero,
            .claim-card {
                padding: 18px;
                border-radius: 17px;
            }

            .claim-item-summary {
                min-height: 210px;
            }

            .claim-actions {
                flex-direction: column;
            }

            .claim-actions button {
                width: 100%;
            }
        }
    </style>
</head>

<body onload="requireLogin()">

<header>
    <nav>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="my-posts.html">My Posts</a>
        <b>Claims</b>

        <a href="notifications.html">
            Notifications
            <span
                id="notification-count"
                class="count-badge"
            ></span>
        </a>

        <a
            href="#"
            onclick="logout(); return false;"
        >
            Logout
        </a>
    </nav>
</header>

<main class="container">

    <section class="page-hero">
        <h1>Claim Requests</h1>

        <p>
            Review ownership details, approve valid claims,
            and track item return progress securely.
        </p>
    </section>

    <div id="message"></div>

    <div id="claims">
        <div class="card loading-card">
            <div class="loading-spinner"></div>
            <strong>Loading claim requests</strong>
            <span>Please wait while your claims are retrieved.</span>
        </div>
    </div>

</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/claims.js"></script>
<script src="js/notifications.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        if (typeof loadNotificationCount === "function") {
            loadNotificationCount();
        }

        if (typeof loadClaims === "function") {
            loadClaims();
        }
    });
</script>

</body>
</html>
