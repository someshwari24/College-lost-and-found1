<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Posts</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body onload="requireLogin()">

<header id="navbar"></header>

<main class="container">

    <div class="page-heading">

        <div>
            <div class="eyebrow">
                Your Activity
            </div>

            <h1 class="page-title">
                My Posts
            </h1>

            <p class="muted">
                Manage your lost and found reports
                and check possible matches.
            </p>
        </div>

        <div class="hero-actions">

            <a
                class="btn"
                href="report-lost.html"
            >
                Report Lost
            </a>

            <a
                class="btn ghost"
                href="report-found.html"
            >
                Report Found
            </a>

        </div>

    </div>

    <div id="message"></div>

    <div id="items">

        <div class="card">
            Loading your posts...
        </div>

    </div>

</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/items.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    if (typeof mountNav === "function") {
        mountNav("posts");
    }

    if (typeof loadItems === "function") {
        loadItems(true);
    }

    if (typeof loadNotificationCount === "function") {
        loadNotificationCount();
    }

});
</script>

</body>
</html>
