<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header></header>

<main class="auth-shell">

    <section class="card auth-card">

        <div class="eyebrow">Welcome back</div>

        <h1>Student Login</h1>

        <p class="muted">
            Sign in to manage reports and claims.
        </p>

        <div id="message"></div>

        <form id="loginForm">

            <label>
                Email

                <input
                    type="email"
                    name="email"
                    placeholder="student@college.edu"
                    required
                >
            </label>

            <label>
                Password

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >
            </label>

            <button type="submit">
                Login
            </button>

        </form>

        <p class="muted">
            New student?
            <a href="register.html">
                Create an account
            </a>
        </p>

    </section>

</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>

<script>
    if (typeof mountNav === "function") {
        mountNav();
    }

    document
        .getElementById("loginForm")
        .addEventListener("submit", loginUser);
</script>

</body>
</html>
