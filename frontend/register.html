<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Registration</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header></header>

<main class="auth-shell">

    <section class="card auth-card">

        <div class="eyebrow">
            Join the Portal
        </div>

        <h1>Student Registration</h1>

        <p class="muted">
            Create an account to report lost and found items.
        </p>

        <div id="message"></div>

        <form id="registerForm">

            <label>
                Full Name

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </label>

            <label>
                Email

                <input
                    type="email"
                    name="email"
                    placeholder="student@college.edu"
                    required
                >
            </label>

            <label>
                Password

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter at least 6 characters"
                    minlength="6"
                    required
                >

                <small id="passwordCount">
                    0 characters
                </small>

            </label>

            <label>
                Department

                <input
                    type="text"
                    name="department"
                    placeholder="Example: CSE"
                    required
                >
            </label>

            <label>
                Phone Number

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    minlength="10"
                    maxlength="10"
                    inputmode="numeric"
                    required
                >
            </label>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="muted">
            Already have an account?

            <a href="login.html">
                Login here
            </a>
        </p>

    </section>

</main>

<script src="js/config.js?v=10"></script>
<script src="js/auth.js?v=10"></script>
<script src="js/ui.js?v=10"></script>

<script>

    if (typeof mountNav === "function") {
        mountNav();
    }

    document
        .getElementById("registerForm")
        .addEventListener("submit", registerUser);

    const passwordInput =
        document.getElementById("password");

    const passwordCount =
        document.getElementById("passwordCount");

    passwordInput.addEventListener("input", function () {

        passwordCount.textContent =
            passwordInput.value.length + " characters";

    });

</script>

</body>

</html>
