<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<header></header>

<main class="auth-shell">

    <section class="card auth-card">

        <div class="eyebrow">
            Join the portal
        </div>

        <h1>Student Registration</h1>

        <p class="muted">
            Create an account to report lost and found items.
        </p>

        <div id="message"></div>

        <form id="registerForm">

            <label>
                Full Name

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </label>

            <label>
                Email

                <input
                    type="email"
                    name="email"
                    placeholder="student@college.edu"
                    required
                >
            </label>

            <label>
                Password

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    minlength="6"
                    required
                >
            </label>

            <label>
                Department

                <input
                    type="text"
                    name="department"
                    placeholder="Example: CSE"
                    required
                >
            </label>

            <label>
                Phone Number

                <input
                    type="tel"
                    name="phone"
                    placeholder="Enter phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                >
            </label>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="muted">
            Already have an account?

            <a href="login.html">
                Login here
            </a>
        </p>

    </section>

</main>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>

<script>
    if (typeof mountNav === "function") {
        mountNav();
    }

    document
        .getElementById("registerForm")
        .addEventListener("submit", registerUser);
</script>

</body>
</html>
